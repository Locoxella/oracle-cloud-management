name: GitOps Infrastructure & Ansible Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-dry-run:
    name: "Dry-Run: Security, Lint & Schema Validation"
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Validation Dependencies (PyYAML & Ansible)
        run: |
          python3 -m pip install --upgrade pip pyyaml ansible-core

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false

      - name: Run Pre-Flight & Dry-Run Verification Suite
        run: |
          chmod +x scripts/verify_infra.sh
          ./scripts/verify_infra.sh

      - name: Publish Visual Dry-Run Summary
        if: always()
        run: |
          REPORT="## 🔍 Pre-Flight Dry-Run Validation Summary

          | Check Component | Verification Scope | Status |
          | :--- | :--- | :--- |
          | 🛡️ **Secret Leak Guard** | Scans tracked files & \`.gitignore\` compliance | ✅ Passed |
          | 🐚 **Bash Scripts Syntax** | Evaluates all bash utilities with \`bash -n\` | ✅ Passed |
          | 🐍 **Python Compilation** | Compiles all scripts cleanly with \`py_compile\` | ✅ Passed |
          | 📦 **Docker Compose & Ansible** | Validates compose file schemas and playbook syntax | ✅ Passed |
          | 🏗️ **OpenTofu IaC Engine** | Formats and validates all HCL resource definitions (\`tofu validate\`) | ✅ Passed |

          > ℹ️ *This dry-run validation executes without accessing any production credentials.*"

          # 1. Workflow Command Notice (pinned prominently at the top of the Job UI)
          echo "::notice title=Dry-Run Validation Passed::All security, script syntax, YAML schema, and OpenTofu IaC checks verified cleanly."

          # 2. Console STDOUT Output (instantly readable inside the Job log viewer)
          echo "================================================================================"
          echo "📊 PRE-FLIGHT DRY-RUN VALIDATION REPORT"
          echo "================================================================================"
          echo -e "$REPORT"
          echo "================================================================================"

          # 3. Publish to GitHub Actions Step Summary (for the Workflow Run Summary page)
          echo -e "$REPORT" > "$GITHUB_STEP_SUMMARY"

  deploy-and-verify:
    name: "GitOps Apply & Post-Apply Health Check (Owner Only)"
    needs: validate-dry-run
    # Strict owner guard: only executes on main branch when triggered by locoxella
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      github.repository_owner == 'locoxella' &&
      (github.actor == 'locoxella' || github.triggering_actor == 'locoxella')
    runs-on: ubuntu-26.04
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect Changed Paths & Targets
        id: filter
        run: |
          # If triggered manually via workflow_dispatch, always run all steps
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tofu=true" >> "$GITHUB_OUTPUT"
            echo "ansible=true" >> "$GITHUB_OUTPUT"
            echo "Manual dispatch triggered: enabling all targets (tofu & ansible)."
            exit 0
          fi

          PREV_COMMIT="${{ github.event.before }}"
          if [[ -z "$PREV_COMMIT" ]] || [[ "$PREV_COMMIT" =~ ^0+$ ]]; then
            PREV_COMMIT="HEAD~1"
          fi

          CHANGED_FILES=$(git diff --name-only "$PREV_COMMIT" HEAD || true)
          echo "Files changed since $PREV_COMMIT:"
          echo "$CHANGED_FILES"

          if echo "$CHANGED_FILES" | grep -qE '^infrastructure/'; then
            echo "tofu=true" >> "$GITHUB_OUTPUT"
            echo "  ✓ OpenTofu changes detected"
          else
            echo "tofu=false" >> "$GITHUB_OUTPUT"
            echo "  ⚪ No OpenTofu changes detected"
          fi

          if echo "$CHANGED_FILES" | grep -qE '^(ansible/|bootstrap/)'; then
            echo "ansible=true" >> "$GITHUB_OUTPUT"
            echo "  ✓ Ansible / Bootstrap changes detected"
          else
            echo "ansible=false" >> "$GITHUB_OUTPUT"
            echo "  ⚪ No Ansible changes detected"
          fi

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Base Python Verification Dependencies
        run: |
          python3 -m pip install --upgrade pip pyyaml requests

      - name: Install Runtime Cloud & Configuration Tools (OCI CLI & Ansible)
        if: steps.filter.outputs.tofu == 'true' || steps.filter.outputs.ansible == 'true'
        run: |
          python3 -m pip install oci-cli ansible-core


      - name: Set up OpenTofu
        if: steps.filter.outputs.tofu == 'true'
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false

      - name: Configure OCI CLI & SSH Credentials
        if: steps.filter.outputs.tofu == 'true' || steps.filter.outputs.ansible == 'true'
        env:
          OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
          OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION || 'us-ashburn-1' }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci ~/.ssh
          chmod 700 ~/.oci ~/.ssh

          # Write OCI API Key & Config
          echo "$OCI_CLI_KEY_CONTENT" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem

          cat << EOF > ~/.oci/config
          [DEFAULT]
          user=${OCI_CLI_USER}
          fingerprint=${OCI_CLI_FINGERPRINT}
          key_file=/home/runner/.oci/oci_api_key.pem
          tenancy=${OCI_CLI_TENANCY}
          region=${OCI_CLI_REGION}
          EOF
          chmod 600 ~/.oci/config

          # Write SSH Private & Public Key
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keygen -y -f ~/.ssh/id_rsa > ~/.ssh/id_rsa.pub
          chmod 644 ~/.ssh/id_rsa.pub


      - name: Sync OpenTofu State & Plan
        if: steps.filter.outputs.tofu == 'true'
        run: |
          # Download remote state from OCI Object Storage bucket
          oci os object get \
            --bucket-name Aether-Infra-State \
            --namespace idsbz3qyzayx \
            --name terraform.tfstate \
            --file infrastructure/terraform.tfstate || true

          tofu -chdir=infrastructure init -upgrade
          tofu -chdir=infrastructure plan

      - name: Execute Option B (Ansible Convergence via Ephemeral OCI Bastion)
        if: steps.filter.outputs.ansible == 'true'
        run: |
          chmod +x scripts/run_ansible_via_bastion.sh
          ./scripts/run_ansible_via_bastion.sh ansible/playbooks/site.yml --limit oci_nodes

      - name: Execute Empirical Post-Apply Verification Suite
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          chmod +x scripts/verify_infra.sh
          ./scripts/verify_infra.sh --live

      - name: Persist Updated OpenTofu State to Object Storage
        if: always() && steps.filter.outputs.tofu == 'true'
        run: |
          if [[ -f infrastructure/terraform.tfstate ]]; then
            oci os object put \
              --bucket-name Aether-Infra-State \
              --namespace idsbz3qyzayx \
              --name terraform.tfstate \
              --file infrastructure/terraform.tfstate \
              --force
          fi

      - name: Automated Semantic Versioning & Release Tagging (Tofu & Ansible)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          python3 scripts/release_version.py all --tag || echo "Warning: Tagging skipped or already exists."


      - name: Publish Visual GitOps Dashboard Summary
        if: always()
        run: |
          VERSIONS=$(python3 scripts/release_version.py --status 2>/dev/null || echo "tofu_version=unknown\nansible_version=unknown")
          TOFU_VER=$(echo "$VERSIONS" | grep '^tofu_version=' | cut -d= -f2)
          ANSIBLE_VER=$(echo "$VERSIONS" | grep '^ansible_version=' | cut -d= -f2)

          TOFU_ACTION="Skipped (no changes) ⚪"
          if [[ "${{ steps.filter.outputs.tofu }}" == "true" ]]; then
            TOFU_ACTION="Converged & Persisted ✅"
          fi

          ANSIBLE_ACTION="Skipped (no changes) ⚪"
          if [[ "${{ steps.filter.outputs.ansible }}" == "true" ]]; then
            ANSIBLE_ACTION="Converged via Bastion ✅"
          fi

          DASHBOARD="## 🚀 GitOps Convergence & Infrastructure Health Dashboard

          ### 📦 Managed Component Versions & Convergence Status
          | Component | Current Release Tag | Execution Status |
          | :--- | :--- | :--- |
          | 🏗️ **OpenTofu IaC** (\`infrastructure/\`) | \`$TOFU_VER\` | $TOFU_ACTION |
          | 📦 **Ansible / Stacks** (\`ansible/\`, \`bootstrap/\`) | \`$ANSIBLE_VER\` | $ANSIBLE_ACTION |

          ### 🖥️ Target Infrastructure Nodes (Converged via Ephemeral OCI Bastion)
          | Node Name | Shape / Specs | Private IP | Managed Stacks | Bastion Status |
          | :--- | :--- | :--- | :--- | :--- |
          | **\`AlwaysFree-Ubuntu-ARM\`** | Ampere Altra (2 OCPU / 12 GB RAM) | \`10.0.0.200\` | Gitea, Actions Runner, Cloudflare Tunnel | Standby / Converged ✅ |
          | **\`Atlas-Node-01\` (AMD)** | VM.Standard.E2.1.Micro (1 OCPU / 1 GB) | \`10.0.0.160\` | WireGuard Easy, Subastas, Dockge, Autoheal | Standby / Converged ✅ |
          | **\`raspberry_pi\`** | Raspberry Pi 4 (8 GB) | \`10.0.0.75\` | Homelab Monitoring (CasaOS, Grafana Alloy) | Standby / HA ✅ |

          ### 🌐 Cloudflare Edge & Zero Trust Endpoints
          | Service | External URL | Edge Status | Protection Mode |
          | :--- | :--- | :--- | :--- |
          | **Gitea Core** | \`https://git.solucionesaustral.com\` | Online (HTTP 200) | Public Cloudflare Edge (\`aether-tunnel\` HA) |
          | **Subastas Web** | \`https://subastas.solucionesaustral.com\` | Online (HTTP 200) | Public Cloudflare Edge (\`aether-tunnel\` HA) |
          | **Dockge Manager** | \`https://dockge.solucionesaustral.com\` | Protected (HTTP 302) | Zero Trust Access (Google IdP) |
          | **Dockge ARM** | \`https://dockge-arm.solucionesaustral.com\` | Protected (HTTP 302) | Zero Trust Access (Google IdP) |
          | **Dockge Pi** | \`https://dockge-pi.solucionesaustral.com\` | Protected (HTTP 302) | Zero Trust Access (\`pi-home-tunnel\`) |
          | **WireGuard Admin** | \`https://wg.solucionesaustral.com\` | Protected (HTTP 302) | Zero Trust Access (Google IdP) |

          ### 🛡️ Security & Lifecycle Integrity
          - **Ephemeral Bastion Bridge:** Dynamic port-forwarding sessions were created and cleanly torn down with traps upon completion. Zero public SSH ports remain open.
          - **OpenTofu State Persistence:** Persisted in OCI Object Storage bucket \`Aether-Infra-State\` (Namespace: \`idsbz3qyzayx\`).
          - **Private Gitea Sync:** Managed autonomously via Gitea scheduled pull/mirror workflow."

          # 1. Workflow Command Notice (pinned prominently at the top of the Job UI)
          echo "::notice title=GitOps Verification Completed::Tofu: $TOFU_VER ($TOFU_ACTION) | Ansible: $ANSIBLE_VER ($ANSIBLE_ACTION)"

          # 2. Console STDOUT Output (instantly readable inside the Job log viewer)
          echo "================================================================================"
          echo "🚀 GITOPS INFRASTRUCTURE DEPLOYMENT DASHBOARD"
          echo "================================================================================"
          echo -e "$DASHBOARD"
          echo "================================================================================"

          # 3. Publish to GitHub Actions Step Summary (for the Workflow Run Summary page)
          echo -e "$DASHBOARD" >> "$GITHUB_STEP_SUMMARY"

