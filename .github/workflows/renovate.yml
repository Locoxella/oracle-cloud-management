name: Renovate Bot

on:
  schedule:
    # Every Monday at 09:00 UTC (06:00 AM America/Argentina/Buenos_Aires)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Renovate Log Level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    name: "Automated Dependency Scan & PR Engine"
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Renovate Bot
        uses: renovatebot/github-action@v41.0.14
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}

      - name: Publish Visual Step Notice
        if: always()
        run: |
          echo "::notice title=Renovate Scan Completed::Automated dependency lifecycle scan evaluated Docker Compose, OpenTofu, and GitHub Actions dependencies."
