name: Renovate Bot

on:
  schedule:
    # Every Monday at 09:00 UTC (06:00 AM America/Argentina/Buenos_Aires)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Renovate Log Level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    name: "Automated Dependency Scan & PR Engine"
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Generate Renovate App Token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ secrets.APPLICATION_ID }}
          private-key: ${{ secrets.APPLICATION_PRIVATE_KEY }}

      - name: Run Renovate Bot
        uses: renovatebot/github-action@v46.3.12
        with:
          configurationFile: .github/renovate.json
          token: ${{ steps.app-token.outputs.token || secrets.RENOVATE_TOKEN || secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}

      - name: Generate Dynamic Runtime Summary & Dashboard Link
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "
          import subprocess, json, os

          report = []
          report.append('## 🤖 Renovate Bot Dependency Scan Results\n')

          try:
              prs_json = subprocess.check_output(['gh', 'pr', 'list', '--json', 'number,title,url,headRefName'], env=os.environ).decode('utf-8')
              prs = json.loads(prs_json)
          except Exception as e:
              prs = []

          if prs:
              report.append(f'### 📦 Active & Newly Generated Pull Requests ({len(prs)})\n')
              report.append('| PR # | Title | Target Branch | Link |')
              report.append('| :---: | :--- | :--- | :--- |')
              for pr in prs:
                  report.append(f'| **#{pr[\"number\"]}** | {pr[\"title\"]} | \`{pr[\"headRefName\"]}\` | [View PR #{pr[\"number\"]}]({pr[\"url\"]}) |')
              notice_msg = f'Renovate generated/updated {len(prs)} Pull Requests ready for review.'
          else:
              report.append('### 📦 Pull Requests\n')
              report.append('✅ **All dependencies are currently up-to-date.** Zero pending Pull Requests.\n')
              notice_msg = 'Renovate scan completed: All dependencies are up to date.'

          report.append('\n### 📋 Interactive Control Panel')
          report.append('- **Dependency Dashboard:** [Issue #3](https://github.com/' + os.environ.get('GITHUB_REPOSITORY', '') + '/issues/3) *(Click checkboxes in this issue to force immediate updates)*')
          report.append('- **All Pull Requests:** [View PR List](https://github.com/' + os.environ.get('GITHUB_REPOSITORY', '') + '/pulls)\n')

          full_report = '\n'.join(report)

          print(f'::notice title=Renovate Scan Results::{notice_msg}')
          print('=' * 80)
          print('📊 RENOVATE BOT DYNAMIC RUNTIME REPORT')
          print('=' * 80)
          print(full_report)
          print('=' * 80)

          summary_path = os.environ.get('GITHUB_STEP_SUMMARY')
          if summary_path:
              with open(summary_path, 'a', encoding='utf-8') as f:
                  f.write(full_report + '\n')
          "
