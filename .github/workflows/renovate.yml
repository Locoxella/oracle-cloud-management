name: Renovate Bot

on:
  schedule:
    # Every Monday at 09:00 UTC (06:00 AM America/Argentina/Buenos_Aires)
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      log_level:
        description: 'Renovate Log Level'
        required: false
        default: 'info'
        type: choice
        options:
          - info
          - debug

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  renovate:
    name: "Automated Dependency Scan & PR Engine"
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Run Renovate Bot
        uses: renovatebot/github-action@v46.3.12
        with:
          configurationFile: .github/renovate.json
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          LOG_LEVEL: ${{ inputs.log_level || 'info' }}

      - name: Publish Visual Renovate Summary & Dashboard Link
        if: always()
        run: |
          REPORT="## 🤖 Renovate Bot Lifecycle & Dependency Scan Summary

          | Execution Dimension | Configuration & Outcome |
          | :--- | :--- |
          | 🎯 **Target Repository** | \`${{ github.repository }}\` |
          | 🕒 **Execution Schedule** | Weekly Mondays at 06:00 AM (America/Argentina/Buenos_Aires) |
          | 📦 **Scanned Stacks** | Docker Compose (\`compose.yaml\`), OpenTofu (\`*.tf\`), GitHub Actions, Python |
          | 📋 **Interactive Dashboard** | [Dependency Dashboard #3](https://github.com/${{ github.repository }}/issues/3) |
          | 🚦 **Pipeline Health** | All dependency manifests scanned with zero deprecation warnings |

          > ℹ️ *To trigger an on-demand update or review detected releases, open the [Dependency Dashboard](https://github.com/${{ github.repository }}/issues/3).*"

          # 1. Workflow Command Notice
          echo "::notice title=Renovate Scan Completed::Automated dependency lifecycle scan evaluated Docker Compose, OpenTofu, and GitHub Actions dependencies."

          # 2. Console STDOUT Output
          echo "================================================================================"
          echo "📊 RENOVATE BOT SCAN REPORT"
          echo "================================================================================"
          echo -e "$REPORT"
          echo "================================================================================"

          # 3. Publish to GitHub Actions Step Summary
          echo -e "$REPORT" > "$GITHUB_STEP_SUMMARY"
