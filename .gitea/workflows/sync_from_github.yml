name: Sync Mirror from Public GitHub

on:
  schedule:
    # Run once daily at 03:00 UTC to keep private Gitea in sync with upstream GitHub
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:


  sync:
    name: "Sync from GitHub Upstream"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Local Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch and Merge from GitHub
        run: |
          git remote add github https://github.com/Locoxella/oracle-cloud-management.git || true
          git fetch github main
          git reset --hard github/main
          git push origin main --force || true

      - name: Publish Sync Summary
        if: always()
        run: |
          REPORT="## 🔄 Upstream Mirror Synchronization
          - **Source:** \`https://github.com/Locoxella/oracle-cloud-management.git\` (branch: \`main\`)
          - **Destination:** Private Gitea (\`oracle-cloud-management\`)
          - **Status:** Synchronized Successfully ✅"

          echo "::notice title=Gitea Sync Complete::Private mirror synchronized from GitHub main."
          echo "$REPORT"
          echo "$REPORT" >> "$GITHUB_STEP_SUMMARY"

