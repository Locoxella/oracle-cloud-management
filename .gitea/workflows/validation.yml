name: Validation Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install PyYAML if needed
        run: |
          python3 -c "import yaml" 2>/dev/null || pip3 install --break-system-packages pyyaml || pip3 install pyyaml || true

      - name: Run Unified Pre-Flight & Dry-Run Suite
        run: |
          chmod +x scripts/verify_infra.sh
          ./scripts/verify_infra.sh
