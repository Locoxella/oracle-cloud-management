services:
  server:
    image: gitea/gitea:latest
    container_name: aether-git-seed
    restart: always
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=sqlite3
      - FORGEJO__service__DISABLE_REGISTRATION=true
      - GITEA__server__ROOT_URL=https://git.solucionesaustral.com/
    volumes:
      - ${GITEA_DATA_DIR:-/opt/stacks/gitea/data}:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2222:22"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  runner:
    image: gitea/act_runner:latest
    container_name: gitea-runner
    restart: always
    environment:
      - GITEA_INSTANCE_URL=http://aether-git-seed:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_REGISTRATION_TOKEN}
      - GITEA_RUNNER_NAME=${GITEA_RUNNER_NAME:-arm-aether-runner}
      - GITEA_RUNNER_LABELS=ubuntu-latest:docker://gitea/runner-images:ubuntu-latest,ubuntu-22.04:docker://gitea/runner-images:ubuntu-22.04,ubuntu-24.04:docker://gitea/runner-images:ubuntu-24.04
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${RUNNER_DATA_DIR:-/opt/stacks/git-runner/data}:/data
