version: "3"

services:
  server:
    image: gitea/gitea:latest
    container_name: aether-git-seed
    restart: always
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=sqlite3 # Inicialmente SQLite, luego migraremos a la Autonomous DB
      - GITEA__service__DISABLE_REGISTRATION=true # Solo para tu uso privado
      - GITEA__server__ROOT_URL=https://git.solucionesaustral.com/
    networks:
      - gitea
    volumes:
      - /mnt/extra-data/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2222:22"
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aether-tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=eyJhIjogIjJhNDkyNzhkYjdiYTkyMDdjMDliZTlkMmMzZTk2NjlhIiwgInQiOiAiNTU3YjEyMGUtNTUzYi00MmY1LWJjNjUtZDJmZmI5ODAwZWE2IiwgInMiOiAiWUpmMDNFajdmejkwalNHTWRpQjNQeVJVcmhDaDQ1MkJ1OVFiOGJpdWFPUT0ifQ==
    networks:
      - gitea
    labels:
      - "autoheal=true"
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: aether-autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=15
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gitea

  dockge:
    image: louislam/dockge:1
    container_name: aether-dockge
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /mnt/extra-data/dockge/data:/app/data
      - /mnt/extra-data/stacks:/mnt/extra-data/stacks
      - /mnt/extra-data/gitea:/mnt/extra-data/stacks/infra
    environment:
      - DOCKGE_STACKS_DIR=/mnt/extra-data/stacks
    networks:
      - gitea

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy
    container_name: wg-easy
    environment:
      - WG_HOST=129.153.185.184
      - PASSWORD_HASH=$$2a$$12$$TWBhobzmIQkIfw/pxGpoteAPwLIxe834N3jjQzcZ2zdi9pmYpwxoC
    volumes:
      - /mnt/extra-data/wg-easy:/etc/wireguard
    ports:
      - "51820:51820/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      - gitea

networks:
  gitea:
    external: false
