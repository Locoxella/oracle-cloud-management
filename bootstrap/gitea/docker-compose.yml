version: "3"

services:
  server:
    image: gitea/gitea:latest
    container_name: aether-git-seed
    restart: always
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=sqlite3 # Inicialmente SQLite, luego migraremos a la Autonomous DB
      - FORGEJO__service__DISABLE_REGISTRATION=true # Solo para tu uso privado
      - GITEA__server__ROOT_URL=https://git.solucionesaustral.com/
    networks:
      - gitea
    volumes:
      - /mnt/extra-data/gitea:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2222:22"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: aether-tunnel
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=eyJhIjogIjJhNDkyNzhkYjdiYTkyMDdjMDliZTlkMmMzZTk2NjlhIiwgInQiOiAiNTU3YjEyMGUtNTUzYi00MmY1LWJjNjUtZDJmZmI5ODAwZWE2IiwgInMiOiAiWUpmMDNFajdmejkwalNHTWRpQjNQeVJVcmhDaDQ1MkJ1OVFiOGJpdWFPUT0ifQ==
    networks:
      - gitea

  wg-easy:
    image: ghcr.io/wg-easy/wg-easy
    container_name: wg-easy
    environment:
      - WG_HOST=129.153.185.184
      - PASSWORD_HASH=$$2a$$12$$S..sO7kP.H8Vn1pYm.HhVOh3Z4r9gK2P6X1J5zP8PzM6U.FkXQp9K # password: admin
    volumes:
      - /mnt/extra-data/wg-easy:/etc/wireguard
    ports:
      - "51820:51820/udp"
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      - gitea

networks:
  gitea:
    external: false
