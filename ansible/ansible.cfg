[defaults]
inventory = inventory/hosts.yml
private_key_file = ~/.ssh/id_rsa
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PubkeyAcceptedKeyTypes=+ssh-rsa -o HostKeyAlgorithms=+ssh-rsa
