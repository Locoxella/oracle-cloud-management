all:
  children:
    oci_nodes:
      hosts:
        atlas_arm:
          ansible_host: "{{ bastion_arm_host | default('10.0.0.200') }}"
          ansible_port: "{{ bastion_arm_port | default(22) }}"
          ansible_user: ubuntu
          node_role: primary_compute_git
          stacks_base_dir: /opt/stacks
          expected_containers:
            - aether-git-seed
            - gitea-runner
            - aether-tunnel-arm
            - aether-dockge
        atlas_amd:
          ansible_host: "{{ bastion_amd_host | default('10.0.0.160') }}"
          ansible_port: "{{ bastion_amd_port | default(22) }}"
          ansible_user: ubuntu
          node_role: edge_vpn_gateway
          extra_volume_mount: /mnt/extra-data
          stacks_base_dir: /mnt/extra-data/stacks
          infra_base_dir: /mnt/extra-data/infrastructure
          expected_containers:
            - aether-dockge
            - aether-autoheal
            - aether-tunnel
            - wg-easy
            - subastas-app
    homelab_nodes:
      hosts:
        raspberry_pi:
          ansible_host: 10.0.0.75
          ansible_user: locoxella
          node_role: homelab_ha_kiosk
          expected_services:
            - docker.service
            - casaos.service
            - alloy.service
            - lnxlink.service
